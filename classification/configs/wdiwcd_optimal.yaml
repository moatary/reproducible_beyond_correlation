
# WDIWCD — Whole-Data Independence Within-Class Dependence
model: WDIWCD
dataset: mnist
seed: 42
n_runs: 5

hyperparameters:
  learning_rate: 0.01
  batch_size: 128
  max_iter: 1000
  hist_bins: 32
  n_components: 16
  per_class_weight: 0.7   # c-equivalent: whole-data vs. per-class split

evaluation:
  knn_k: 50
  n_hist_bins: 64
